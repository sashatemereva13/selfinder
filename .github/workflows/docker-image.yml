name: Docker Image Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - "Dockerfile"
      - "backend/**"
      - ".github/workflows/docker-image.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "Dockerfile"
      - "backend/**"
      - ".github/workflows/docker-image.yml"

permissions:
  contents: read

concurrency:
  group: docker-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-check-frontend:
    name: Frontend Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build frontend image
        run: docker build -t selfinder-frontend:${{ github.sha }} .

  docker-check-backend:
    name: Backend Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build backend image
        run: docker build -t selfinder-backend:${{ github.sha }} ./backend
