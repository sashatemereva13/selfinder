name: Docker Image Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - "Dockerfile"
      - "backend/**"
      - "shared/**"
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "Dockerfile"
      - "backend/**"
      - "shared/**"
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"

permissions:
  contents: read

concurrency:
  group: docker-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-check-frontend:
    name: Frontend Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build frontend image
        run: docker build -t selfinder-frontend:${{ github.sha }} .

  docker-check-backend:
    name: Backend Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Same context as deploy-backend.yml: the repo root, because the
      # Dockerfile copies backend/ and shared/ from there.
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t selfinder-backend:${{ github.sha }} .

      # No MongoDB here, so the server can't start — check the image itself.
      - name: Check backend image contents
        run: |
          docker run --rm --entrypoint sh selfinder-backend:${{ github.sha }} -c '
            test "$(id -u)" != 0 || { echo "runs as root"; exit 1; }
            test ! -e /app/.env || { echo ".env baked into image"; exit 1; }
            test -f /shared/package.json || { echo "shared/ missing"; exit 1; }
          '
