name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    defaults:
      run:
        working-directory: frontend

    steps:
      # checkout repo
      - name: checkout repository
        uses: actions/checkout@v5

      - name: setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Exactly the lockfile — the same dependencies CI tested.
      - name: install dependencies
        run: npm ci

      - name: run tests
        run: npm test

      # build project
      - name: build project
        run: npm run build

      - name: deploy to VPS
        # Pinned to a commit, not a tag: this step receives the server's SSH
        # key, and a tag can be moved to different code by whoever controls
        # the action's repo. Renovate proposes SHA bumps as reviewed PRs.
        uses: burnett01/rsync-deployments@66257cad6bfeb2171d3b6bfa6c9a22279dd9c3a1 # 8.0.5
        with:
          switches: -avzr --delete
          path: frontend/dist/
          remote_path: /var/www/selfinder/frontend
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}
