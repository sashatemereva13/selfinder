name: Deploy MongoDB Backup Script

# This workflow does NOT run the backup itself. Atlas's Network Access
# list for this project only allows the VPS's fixed IP — a GitHub-hosted
# runner has no stable IP, so the first version of this workflow (which
# ran mongodump directly in Actions) failed every time with a TLS error
# from Atlas that turned out to be an access-list rejection, not a real
# TLS problem. Opening Atlas to 0.0.0.0/0 just to let CI connect was
# deliberately rejected as too wide a tradeoff for a cron job — see
# docs/backup-strategy.md.
#
# Instead: the actual backup (monitoring/backup-mongodb.sh) runs on the
# VPS itself, via cron, using the box's own already-trusted IP. This
# workflow only keeps that script and its crontab entry up to date on
# the server whenever the script changes — the same SSH-deploy shape as
# deploy-backend.yml, applied to a script instead of a container.

on:
  push:
    branches:
      - main
    paths:
      - "monitoring/backup-mongodb.sh"
      - ".github/workflows/backup-mongodb.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backup-script-production
  cancel-in-progress: false

env:
  BACKUP_SCRIPT_PATH: ${{ vars.BACKUP_SCRIPT_PATH || '/opt/selfinder/backup/backup-mongodb.sh' }}
  BACKUP_CRON_SCHEDULE: ${{ vars.BACKUP_CRON_SCHEDULE || '0 4 * * *' }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production

    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: copy backup script to the VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "monitoring/backup-mongodb.sh"
          target: "/tmp/selfinder-backup-deploy"

      - name: install script and cron entry
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu

            UPLOADED="$(find /tmp/selfinder-backup-deploy -name backup-mongodb.sh -type f)"
            if [ -z "$UPLOADED" ]; then
              echo "backup-mongodb.sh not found under /tmp/selfinder-backup-deploy after upload" >&2
              exit 1
            fi

            sudo mkdir -p "$(dirname "${{ env.BACKUP_SCRIPT_PATH }}")"
            sudo mv "$UPLOADED" "${{ env.BACKUP_SCRIPT_PATH }}"
            sudo chmod 750 "${{ env.BACKUP_SCRIPT_PATH }}"
            rm -rf /tmp/selfinder-backup-deploy

            # This box's own crontab, keyed by a comment marker so re-runs
            # replace the one line rather than accumulating duplicates.
            MARKER="# selfinder-mongodb-backup"
            ( crontab -l 2>/dev/null | grep -vF "$MARKER" ; \
              echo "${{ env.BACKUP_CRON_SCHEDULE }} ${{ env.BACKUP_SCRIPT_PATH }} $MARKER" \
            ) | crontab -

            echo "Installed. Current crontab:"
            crontab -l
