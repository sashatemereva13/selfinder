name: Live security check

# Drift detection (Session D): pre-merge checks ask "was it right when it
# shipped?"; this asks "is it still right now?" — against the real site,
# daily and after every deploy. The nginx config lives on a shared server
# and is edited by hand, so this is what notices when it stops matching
# terraform/nginx/selfinder.conf. A failed scheduled run emails the repo
# owner (GitHub's default notification for failed workflows).

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_run:
    workflows: ["Deploy Backend", "Deploy Frontend"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: check https://selfinder.online
        run: scripts/check-live-security.sh https://selfinder.online
