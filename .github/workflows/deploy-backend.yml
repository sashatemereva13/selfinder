name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/selfinder-backend
  CONTAINER_NAME: selfinder-backend
  BACKEND_PORT: ${{ vars.BACKEND_PORT || '3001' }}
  BACKEND_ENV_FILE: ${{ vars.BACKEND_ENV_FILE || '/opt/selfinder/backend/.env' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    defaults:
      run:
        working-directory: backend

    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: install dependencies
        run: npm ci

      - name: run tests
        run: npm test

      - name: login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: deploy backend container
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              --env-file "${{ env.BACKEND_ENV_FILE }}" \
              -p ${{ env.BACKEND_PORT }}:${{ env.BACKEND_PORT }} \
              ${{ env.IMAGE_NAME }}:${{ github.sha }}

            curl --fail --silent --show-error \
              "http://127.0.0.1:${{ env.BACKEND_PORT }}/api/health"
