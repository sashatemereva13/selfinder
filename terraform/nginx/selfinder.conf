# Captured verbatim from /etc/nginx/sites-available/selfinder on the
# live VPS (srv1229561.hstgr.cloud) on 2026-08-18. This is real running
# config, not aspirational — it did not exist anywhere in version
# control before this. Certbot-managed blocks are left exactly as
# Certbot wrote them (its own tooling expects to find/edit these
# comments verbatim on renewal).
#
# NOT currently wired into any deploy/provisioning automation — this is
# a snapshot for visibility and disaster-recovery reference. Deploying
# it automatically (e.g. via the post-install script in Phase 1, or an
# Ansible playbook in Phase 3) is future work, not yet implemented. Do
# not assume this file is what's live if the server has been touched
# since 2026-08-18 — diff against the real file before trusting it.

server {
    server_name selfinder.online www.selfinder.online;

    root /var/www/selfinder/frontend;
    index index.html;

    location /api/ {
           proxy_pass http://localhost:3002;
           proxy_http_version 1.1;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
}

    location / {
        try_files $uri /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/selfinder.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/selfinder.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.selfinder.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = selfinder.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name selfinder.online www.selfinder.online;

    listen 80;
    return 404; # managed by Certbot




}
