# Updated to match the live /etc/nginx/sites-enabled/selfinder config
# supplied on 2026-10-28. Certbot-managed blocks are left exactly as
# Certbot wrote them (its own tooling expects to find/edit these
# comments verbatim on renewal).
#
# NOT currently wired into any deploy/provisioning automation — this is
# a snapshot for visibility and disaster-recovery reference. Deploying
# it automatically (e.g. via the post-install script in Phase 1, or an
# Ansible playbook in Phase 3) is future work, not yet implemented. Do
# not assume this file is what's live if the server has been touched
# since the supplied snapshot — diff against the real file before
# applying it. This is a reference snapshot, not deployment automation.

server {
    server_name selfinder.online www.selfinder.online;

    # Security headers for the HTTPS application, sent on error responses as
    # well (`always`).
    #
    # Scope (moved 2026-11-07): these live INSIDE Selfinder's HTTPS server
    # block. They used to sit outside it, in nginx's shared `http` context — on
    # this multi-tenant VPS that applied them to every other site that doesn't
    # set its own headers, which is fine for nosniff but not for HSTS
    # includeSubDomains or a CSP written for Selfinder's bundle.
    #
    # Inheritance trap: nginx only passes these server-level add_header lines
    # down to a location block that has NO add_header of its own. Adding one to
    # `location /api/` (say) would silently drop every header here for that
    # location. Keep all add_header lines in this one place.

    # Don't advertise the exact nginx/Ubuntu version in the Server header and on
    # error pages (2026-11-07) — it's a free shortlist of known CVEs to try.
    server_tokens off;

    # includeSubDomains (2026-11-07): every subdomain must be HTTPS too. Safe
    # today — the only one is www, which is HTTPS. Grafana/Prometheus are reached
    # by SSH tunnel, not a subdomain. Before adding any subdomain, give it HTTPS
    # first: browsers that have seen this header will refuse plain HTTP to it
    # for a year.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Content-Security-Policy, REPORT-ONLY (2026-11-07). Nothing is blocked yet;
    # browsers report what this policy would block to /api/csp-report (logged to
    # Loki as "CSP violation", counted in Prometheus as csp_violations_total).
    # After a week or two of real traffic with only expected reports, rename the
    # header to Content-Security-Policy to enforce it.
    #
    # Built from what the web build actually loads: its own bundle (no inline
    # scripts or <style> tags in dist/index.html), Google Fonts' stylesheet and
    # font files, the 3D model and its textures (blob:/data:), and the data
    # export's blob: download. No 'unsafe-inline', no 'unsafe-eval', no
    # wildcards. Any new third-party script, font or API origin must be added
    # here on purpose.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/csp-report" always;

    root /var/www/selfinder/frontend;
    index index.html;

    location /api/ {
           # Match Express's 64 KB JSON parser limit. Nginx rejects larger
           # request bodies before proxying them to the application.
           client_max_body_size 64k;
           proxy_pass http://localhost:3002;
           proxy_http_version 1.1;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
}

    location / {
        try_files $uri /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/selfinder.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/selfinder.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.selfinder.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = selfinder.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name selfinder.online www.selfinder.online;
    server_tokens off;
    listen 80;
    return 404; # managed by Certbot




}
