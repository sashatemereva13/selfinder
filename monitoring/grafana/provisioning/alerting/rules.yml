apiVersion: 1

groups:
  - orgId: 1
    name: selfinder-availability
    folder: Selfinder Alerts
    interval: 1m
    rules:
      # Availability — the simplest possible black-box check: if
      # Prometheus can't scrape the target at all, treat it as down
      # regardless of the underlying cause.
      - uid: selfinder-backend-down
        title: Selfinder backend is down
        condition: C
        for: 1m
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'up{job="selfinder-backend"}'
              refId: A
              instant: true
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot scrape selfinder-backend:3002/metrics — the app is very likely down."

  - orgId: 1
    name: selfinder-golden-signals
    folder: Selfinder Alerts
    interval: 1m
    rules:
      # Errors golden signal — 5xx ratio over a 5m window.
      - uid: selfinder-high-error-rate
        title: Selfinder backend error rate is high
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(rate(http_requests_total{job="selfinder-backend", status_code=~"5.."}[5m])) / sum(rate(http_requests_total{job="selfinder-backend"}[5m]))'
              refId: A
              instant: true
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests to selfinder-backend are returning 5xx over the last 5 minutes."

      # Latency golden signal — p95, not average: an average hides the
      # slow 5% of requests, p95 is closer to what real unlucky users
      # actually experience.
      - uid: selfinder-high-p95-latency
        title: Selfinder backend p95 latency is high
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="selfinder-backend"}[5m])) by (le))'
              refId: A
              instant: true
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [3] }
        labels:
          severity: warning
        annotations:
          summary: "Selfinder backend p95 request latency has exceeded 3s over the last 5 minutes."

  - orgId: 1
    name: vps-infrastructure
    folder: Selfinder Alerts
    interval: 1m
    rules:
      # Saturation golden signal, at the host level — distinguishes "the
      # app is unhealthy" from "the box it runs on is out of headroom."
      # Whole-VPS scope, matching cadvisor/node-exporter's coverage of
      # every project on this box, not just Selfinder.
      - uid: vps-disk-almost-full
        title: VPS disk usage is critical
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: '100 - ((node_filesystem_avail_bytes{mountpoint="/", fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/", fstype!="rootfs"}) * 100)'
              refId: A
              instant: true
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
        labels:
          severity: critical
        annotations:
          summary: "Root filesystem on srv1229561 is over 90% full."

      - uid: vps-memory-pressure
        title: VPS memory usage is critical
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: '(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100'
              refId: A
              instant: true
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
        labels:
          severity: warning
        annotations:
          summary: "Memory usage on srv1229561 is over 90%."

      # Crash-loop detection — the same concept Kubernetes calls
      # CrashLoopBackOff, generalized to plain Docker via cadvisor's
      # container restart count. Whole-VPS scope: catches any project's
      # container repeatedly restarting, not just Selfinder's.
      - uid: vps-container-restart-loop
        title: A container is restart-looping
        condition: C
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(increase(container_start_time_seconds{name!=""}[1h])) by (name)'
              refId: A
              instant: true
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [3] }
        labels:
          severity: warning
        annotations:
          summary: "A container on srv1229561 has restarted more than 3 times in the last hour."
