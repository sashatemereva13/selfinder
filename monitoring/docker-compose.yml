# Observability stack for the whole VPS (srv1229561.hstgr.cloud) — not
# Selfinder-only. Selfinder's own backend (deployed separately via
# .github/workflows/deploy-backend.yml, NOT by this compose file) is
# attached to the `monitoring` network below so Prometheus can reach its
# /metrics endpoint by container name.
#
# Deploy: `docker compose -f monitoring/docker-compose.yml up -d` on the
# VPS. Not yet wired into CI — see docs/roadmap.md Phase 2 for the plan
# to provision this via Terraform/cloud-init instead of a manual step.
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9090:9090" # not exposed publicly — reach via SSH tunnel or Grafana
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: monitoring-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - monitoring

  loki:
    image: grafana/loki:latest
    container_name: monitoring-loki
    restart: unless-stopped
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    command:
      - "-config.file=/etc/loki/loki.yml"
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:latest
    container_name: monitoring-promtail
    restart: unless-stopped
    volumes:
      - ./promtail.yml:/etc/promtail/promtail.yml:ro
      # Read-only access to every container's logs on this VPS (not just
      # Selfinder's) — same whole-box scope as cadvisor above. Docker
      # writes each container's stdout/stderr as JSON files under here;
      # Promtail tails them directly rather than going through the
      # Docker API, so no socket access is needed.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "-config.file=/etc/promtail/promtail.yml"
    networks:
      - monitoring
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000" # not exposed publicly — front with nginx + TLS before real use
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt # gitignored — see monitoring/README.md

networks:
  monitoring:
    name: monitoring
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
